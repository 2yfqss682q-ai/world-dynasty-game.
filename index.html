function makeMarket(){
  return {index:Object.fromEntries([...RESOURCES,...COMMON].map(r=>[r.id,100])),history:[],updated:0};
}
function marketCycle(s){
  const m=s.market??(s.market=makeMarket());
  const worldPop=sum(s.countries,population);
  const data={day:s.day,year:START_YEAR+Math.floor(s.day/365),worldPopulation:worldPop,
    worldGDP:rnd(sum(s.countries,'gdpAnnual'),2),
    activeWars:s.wars.filter(w=>w.status==='en cours').length,prices:{}};
  for(const r of [...RESOURCES,...COMMON]){
    const stock=sum(s.countries,c=>c.stocks[r.id]||0);
    const reserve=sum(s.countries,c=>c.reserves[r.id]||0);
    const baseline=r.id==='cereales'?worldPop*.292/1000/365*30:
      r.id==='bois'?worldPop/1000000*.20:
      r.id==='pierre'?worldPop/1000000*.14:
      r.strategic?worldPop/1000000*.05:worldPop/1000000*.10;
    const coverage=stock/Math.max(.001,baseline);
    const scarcity=clamp((3-coverage)*.20,-.45,1.1);
    const strategicPremium=r.strategic&&reserve>0&&stock<baseline?.08:0;
    const warPremium=r.id==='fer'||r.id==='charbon'?data.activeWars*.035:0;
    const target=clamp(100*(1+scarcity+strategicPremium+warPremium),35,250);
    const prev=m.index[r.id]??100;
    m.index[r.id]=rnd(clamp(prev*.80+target*.20,35,250),1);
    data.prices[r.id]=m.index[r.id];
  }
  m.updated=s.day;m.history.push(data);m.history=m.history.slice(-72);
}
function domesticProductionCycle(s){
  for(const c of s.countries){
    c.embargoes??=[];
    c.production.mining??={};
    const scale=population(c)/1000000;
    const mineFactor=sum(c.provinces,'mines')/c.provinces.length;
    for(const id of ['bois','pierre','argile','coton','poisson','sel']){
      const stored=c.reserves[id]||0;
      const quantity=rnd(Math.min(stored,Math.max(0,scale*(.11+mineFactor*.18))),5);
      if(quantity>0){
        c.reserves[id]=rnd(stored-quantity,5);
        c.stocks[id]=rnd((c.stocks[id]||0)+quantity,5);
        c.production.mining[id]=quantity;
      }else c.production.mining[id]=0;
    }
    const maintenance={bois:rnd(scale*.09,5),pierre:rnd(scale*.065,5)};
    let unmet=0;
    for(const [id,needed] of Object.entries(maintenance)){
      const used=Math.min(needed,c.stocks[id]||0);
      c.stocks[id]=rnd(Math.max(0,(c.stocks[id]||0)-used),5);
      unmet+=needed>0?(needed-used)/needed:0;
    }
    if(unmet>.01){
      for(const p of c.provinces)p.roads=clamp(rnd(p.roads-unmet*.00018,5),0,1);
    }
    c.maintenanceShortage=rnd(unmet/2,4);
  }
}
function crisisCycle(s){
  if(s.day<90)return;
  const c=s.countries[Math.floor(random(s)*s.countries.length)];
  const p=c.provinces[Math.floor(random(s)*c.provinces.length)];
  if(!p)return;
  const r=random(s);
  if(r<.32){
    p.rainfall=clamp(rnd(p.rainfall-.14,3),.05,.96);
    p.farms=clamp(rnd(p.farms-.018,4),0,1);
    event(s,'climate',`Sécheresse régionale dans ${p.name} (${c.short}) : précipitations et rendement agricole en baisse.`,[c.id]);
  } else if(r<.57){
    p.roads=clamp(rnd(p.roads-.028,4),0,1);
    p.housing=clamp(rnd(p.housing-.020,4),0,1);
    event(s,'climate',`Inondations dans ${p.name} (${c.short}) : voies et logements endommagés.`,[c.id]);
  } else if(r<.78&&p.industry>.30){
    p.industry=clamp(rnd(p.industry-.016,4),0,1);
    p.pollution=clamp(rnd(p.pollution+.02,4),0,1);
    event(s,'industry',`Accident industriel dans ${p.name} : capacité réduite et pollution accrue.`,[c.id]);
  } else {
    c.approval=clamp(rnd(c.approval-.018,4),0,1);
    c.stability=clamp(rnd(c.stability-.012,4),0,1);
    event(s,'social',`Mouvement social en ${c.short} : la confiance et la stabilité reculent.`,[c.id]);
  }
}
function advancePrograms(s){
  for(const pr of s.programs||[]){
    if(pr.status!=='en cours')continue;
    const c=countryById(s,pr.owner),p=c?.provinces.find(z=>z.id===pr.provinceId);
    if(!p){pr.status='annulé';event(s,'politics',`Programme ${pr.sector} interrompu après un changement de contrôle territorial.`,[pr.owner]);continue;}
    if(s.day>=pr.finish||pr.spent>=pr.budget-.00001){
      pr.status='terminé';event(s,'construction',`Programme national « ${PROGRAM_SECTORS[pr.sector].label} » de ${c.short} achevé : ${rnd(pr.spent,2)} M Cr investis.`,[c.id]);continue;
    }
    const item=PROGRAM_SECTORS[pr.sector];
    const daily=rnd(Math.min(pr.budget-pr.spent,pr.budget/pr.duration),5);
    if(c.treasury+1e-7<daily){
      pr.status='suspendu';event(s,'economy',`Programme de ${c.short} suspendu : trésorerie insuffisante.`,[c.id]);continue;
    }
    spend(s,c,daily,`Programme national ${item.label}`);
    pr.spent=rnd(pr.spent+daily,5);
    p[item.field]=clamp(rnd(p[item.field]+daily*item.efficiency,6),0,1);
    if(s.day+1>=pr.finish||pr.spent>=pr.budget-.00001){
      pr.status='terminé';event(s,'construction',`Programme national « ${item.label} » de ${c.short} achevé : ${rnd(pr.spent,2)} M Cr investis.`,[c.id]);
    }
  }
}

function transfer(s,from,to,amount,reason){
  if(!Number.isFinite(amount)||amount<0)throw Error('Montant monétaire invalide');
  const [ownerA,accA]=from; const [ownerB,accB]=to;
  const a=s.countries[ownerA],b=s.countries[ownerB];
  if(!a||!b||!['treasury','privateWealth'].includes(accA)||!['treasury','privateWealth'].includes(accB))throw Error('Compte invalide');
  if(a[accA]+.000001<amount)throw Error(`${a.short}: fonds insuffisants`);
  if(amount===0)return;
  a[accA]=rnd(a[accA]-amount,5);b[accB]=rnd(b[accB]+amount,5);
  s.ledger.push({id:s.nextLedger++,day:s.day,from:`${ownerA}:${accA}`,to:`${ownerB}:${accB}`,amount: rnd(amount,5),reason});
  if(s.ledger.length>3000)s.ledger.splice(0,s.ledger.length-3000);
}

function getInitialReserves(s,c){

    reserves[r.id]=!owned?0:(c.id===PLAYER_ID?rnd(second*135,3):rnd(second*between(s,.38,1),3));
    stocks[r.id]=owned&&!['petrole','gaz','uranium','lithium','terres_rares'].includes(r.id)?rnd(Math.min(reserves[r.id]*.00011,20),5):0;

    stocks[r.id]=rnd(between(s,9,75),3);

function resourceDominance(s){

    const second=others[0]?.value??0;
    return {id:r.id,name:r.name,unit:r.unit,player:p.reserves[r.id],second,secondCountry:others[0]?.id??null,
      countriesWithDeposit:others.length+1,ratio:second>0?rnd(p.reserves[r.id]/second,2):null};

function verifyWorld(s,{initial=false}={}){
  if((s.migrations||[]).some(m=>m.count<0)|| (s.shipments||[]).some(sh=>sh.quantity<0||sh.delivered<0||sh.loss<0||sh.delivered+sh.loss>sh.quantity+.00005))throw Error('Flux de marchandises ou personnes invalides');
  if(s.countries.length!==11||s.agents.length!==10||s.continents.length!==3||s.playerId!==10)throw Error('Configuration du monde incorrecte');
  const ids=new Set(s.countries.map(c=>c.id));if(ids.size!==11)throw Error('Identifiants dupliqués');
  let areaTotal=0;
  for(const c of s.countries){
    for(const k of ['treasury','privateWealth','taxRate','legitimacy','soldiers','immigrants','emigrants'])if(!Number.isFinite(c[k])||c[k]<0)throw Error(`${c.short} possède une valeur invalide : ${k}`);
    if(!c.provinces.length)throw Error('Nation sans provinces');
    for(const p of c.provinces){if(p.population<0||p.areaKm2<=0)throw Error('Province invalide');areaTotal+=p.areaKm2;}
    for(const r of [...RESOURCES,...COMMON]){if(!Number.isFinite(c.reserves[r.id])||!Number.isFinite(c.stocks[r.id])||c.reserves[r.id]<0||c.stocks[r.id]<0)throw Error('Ressource négative ou non numérique');}
  }
  if(initial){
    for(const r of resourceDominance(s))if(!(r.player>0)||r.second>0 && r.player<r.second*100)throw Error(`Déséquilibre stratégique ${r.name}`);
    if(s.countries.some(c=>c.id!==s.playerId&&RESOURCES.every(r=>c.reserves[r.id]>0)))throw Error('Un rival possède toutes les ressources');
    const petro=s.countries.filter(c=>c.reserves.petrole>0);if(petro.length!==2)throw Error('Pétrole : 2 propriétaires requis');
  }
  return true;

    }else if(['welfare','press','openBorders','antiCorruption','educationPriority'].includes(x.field)){
      if(!validNum(x.value,0,1))throw Error('Valeur requise entre 0 et 1');c.policy[x.field]=Number(x.value);
      c.legitimacy=clamp(c.legitimacy-.003,0,1);

function command(s,actorId,type,payload={}){
  const c=countryById(s,actorId);if(!c)throw Error('Auteur inconnu');
  if(!ACTION_TYPES.includes(type))throw Error(`Commande inconnue : ${type}`);
  if(s.orders.length>200)throw Error('File d’ordres saturée');
  if(!payload||typeof payload!=='object'||Array.isArray(payload))throw Error('Paramètres d’ordre invalides');
  // Refus immédiat des commandes incohérentes; les contrôles financiers se répètent à l'exécution.
  const o={id:s.nextOrder++,issued:s.day,actor:c.id,type,payload:cp(payload),status:'en attente'};
  s.orders.push(o);return o;
}
function applyOrders(s){
  const orders=s.orders.splice(0);
  for(const o of orders){
    try{intention(s,countryById(s,o.actor),o.type,o.payload);o.status='appliqué';}
    catch(e){o.status='refusé';o.reason=e.message;event(s,'rejected',`${countryById(s,o.actor)?.short||'État'} : ordre refusé — ${e.message}.`,[o.actor]);}
    s.notes.push({day:s.day,id:o.id,status:o.status,reason:o.reason||'',kind:o.type});
    const agent=s.agents.find(a=>a.countryId===o.actor);
    if(agent){agent.privateMemory.push({day:s.day,action:o.type,status:o.status,reason:o.reason||'Décision exécutée'});agent.privateMemory=agent.privateMemory.slice(-60);}
  }
  s.notes=s.notes.slice(-300);
}
function publicSectorDay(s,c){
  c.gdpAnnual=computeGDP(c);
  const tax=rnd(Math.min(c.privateWealth*.005,c.gdpAnnual*c.taxRate/365),5);
  if(tax>0)transfer(s,[c.id,'privateWealth'],[c.id,'treasury'],tax,'Impôts et prélèvements');
  const ordinary=Math.min(c.treasury,c.gdpAnnual*c.taxRate/365*.71);
  if(ordinary>0)transfer(s,[c.id,'treasury'],[c.id,'privateWealth'],rnd(ordinary,5),'Services publics et administration');
  // Les allocations ont un effet marginal sur la qualité des services, soumis à l'usure et au temps.
  const effort=ordinary/Math.max(1,population(c)/500000);
  for(const province of c.provinces){
    province.health=clamp(rnd(province.health+effort*c.budget.services*.000014,6),0,1);
    province.education=clamp(rnd(province.education+effort*c.budget.research*.000024,6),0,1);
    province.roads=clamp(rnd(province.roads+effort*c.budget.infrastructure*.00001,6),0,1);
  }
  const soldiers=rnd(c.soldiers*.000016,5);const army=Math.min(c.treasury,soldiers);
  if(army>0)transfer(s,[c.id,'treasury'],[c.id,'privateWealth'],army,'Soldes et approvisionnement militaire');
  c.cashFlow={tax,spending:rnd(ordinary,3),army:rnd(army,3),interest:0};
  if(army+1e-5<soldiers)c.militaryReadiness=clamp(c.militaryReadiness-.005,0,1);
  else c.militaryReadiness=clamp(c.militaryReadiness+.0001*(1-c.warExhaustion),0,1);
  for(const debt of c.debt){
    if(debt.principal<=0)continue;
    const dailyInterest=rnd(debt.principal*debt.rate/365,5);
    const creditor=countryById(s,debt.creditor);if(creditor&&c.treasury>=dailyInterest&&dailyInterest>0){
      transfer(s,[c.id,'treasury'],[creditor.id,'treasury'],dailyInterest,'Intérêt sur dette');c.cashFlow.interest+=dailyInterest;
    }else if(dailyInterest>0)debt.arrears=rnd((debt.arrears||0)+dailyInterest,5);
    if(s.day>=debt.due&&debt.principal>0&&creditor){
      const repayment=Math.min(c.treasury,debt.principal);if(repayment>0){transfer(s,[c.id,'treasury'],[creditor.id,'treasury'],repayment,'Remboursement dette');debt.principal=rnd(debt.principal-repayment,5);}
      if(debt.principal>0&&s.day===debt.due)event(s,'debt',`${c.short} ne rembourse pas entièrement son prêt à échéance.`,[c.id,creditor.id]);
    }
  }
}

function economyKPIs(c){const x=nationalStats(c);return [smStat('Trésorerie',money(x.treasury),'Réserve immédiatement utilisable'),smStat('PIB annuel',money(x.gdpAnnual),'Estimation de production'),smStat('Dette publique',money(x.debt),'Principal hors intérêts'),smStat('Population',fmt(x.population),`${fmt(x.areaKm2)} km² de territoire`) ].join('');}
function rankings(sortBy='gdpAnnual'){
 const sorted=[...s.countries].sort((a,b)=>{const av=sortBy==='population'?nationalStats(a).population:sortBy==='treasury'?a.treasury:sortBy==='areaKm2'?nationalStats(a).areaKm2:a.gdpAnnual;const bv=sortBy==='population'?nationalStats(b).population:sortBy==='treasury'?b.treasury:sortBy==='areaKm2'?nationalStats(b).areaKm2:b.gdpAnnual;return bv-av;});
 return `<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>État</th><th>Continent</th><th class="num">Habitants</th><th class="num">Superficie km²</th><th class="num">PIB (M Cr)</th><th class="num">Trésor</th></tr></thead><tbody>${sorted.map((c,i)=>`<tr class="clickable" data-country="${c.id}"><td>${i+1}</td><td>${flag(c)} ${esc(c.short)} ${c.id===s.playerId?'<span class="tint">(vous)</span>':''}</td><td>${esc(CONTINENTS[c.continent].name)}</td><td class="num">${fmt(nationalStats(c).population)}</td><td class="num">${fmt(nationalStats(c).areaKm2)}</td><td class="num">${fmt(c.gdpAnnual,1)}</td><td class="num">${fmt(c.treasury,1)}</td></tr>`).join('')}</tbody></table></div>`;
}
function mapMarkup(){
 const visible=continentFilter==='all'?s.countries:s.countries.filter(c=>c.continent===Number(continentFilter));
 const viewbox=continentFilter==='all'?'0 0 1200 690':CONTINENTS[Number(continentFilter)].viewBox;
 const label=CONTINENTS.map((c,i)=>{const pos=[[294,75],[918,78],[608,408]][i];return `<text class="continent-label" x="${pos[0]}" y="${pos[1]}" text-anchor="middle">${c.name.toUpperCase()}</text>`;}).join('');
 const cells=visible.flatMap(c=>c.provinces.map(p=>{
  const pts=p.polygon.map(q=>q.join(',')).join(' ');
  let fill=c.color;
  if(mapLayer==='population'){const value=p.population/Math.max(1,p.areaKm2),a=Math.min(80,Math.max(14,Math.round(value*3)));fill=`hsl(31 64% ${a}%)`;}
  if(mapLayer==='stabilite'){fill=`hsl(${Math.round((1-p.unrest)*125)} 43% 40%)`;}
  if(mapLayer==='agriculture'){fill=`hsl(105 45% ${Math.round(20+p.fertility*50)}%)`;}
  return `<polygon class="province ${c.id===10?'player':''} ${selectedProvince===p.id?'selected':''}" points="${pts}" fill="${fill}" data-province="${attr(p.id)}"><title>${esc(p.name)} — ${fmt(p.population)} hab.</title></polygon>`;
 })).join('');
 const capitals=visible.map(c=>{const q=c.corners;const x=q.reduce((a,p)=>a+p[0],0)/4,y=q.reduce((a,p)=>a+p[1],0)/4;return `<circle class="map-city" cx="${x}" cy="${y}" r="3.5"/><text class="nation-label" x="${x}" y="${y-12}" text-anchor="middle" style="font-size:12px">${esc(c.short)}</text>`;}).join('');
 return `<div class="map-controls">${[['all','Les 3 continents'],...CONTINENTS.map(c=>[String(c.id),c.name])].map(([id,t])=>`<button data-continent="${id}" class="${String(continentFilter)===id?'active':''}">${t}</button>`).join('')}</div><div class="map-controls layerline">${[['politique','Politique'],['population','Densité'],['stabilite','Tensions'],['agriculture','Fertilité']].map(([id,t])=>`<button data-layer="${id}" class="${mapLayer===id?'active':''}">${t}</button>`).join('')}</div><div class="map-container"><svg viewBox="${viewbox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Carte interactive des trois continents et des onze pays"><rect x="0" y="0" width="1200" height="690" fill="#102f41"/><path class="landmass" d="M67 99 Q143 54 261 74 L503 101 L505 267 L481 369 L280 372 L87 366 L63 241 Z"/><path class="landmass" d="M699 96 Q798 53 918 77 L1120 96 L1131 251 L1111 363 L707 368 L686 261 Z"/><path class="landmass" d="M360 409 L889 403 L894 597 L859 643 L369 638 L348 513 Z"/><text class="ocean-label" x="589" y="221" text-anchor="middle">OCÉAN</text>${label}${cells}${capitals}</svg></div><div class="map-legend"><span>◆ Astérie : votre nation</span><span>Appuyez sur une province pour l’inspecter.</span><span>Carte fictive originale, pas une carte terrestre réelle</span></div>`;
}
function profile(c){const x=nationalStats(c);return `<div class="ruler"><div class="ruler-badge"><div class="ruler-icon">▦</div><div><div class="ruler-name">${esc(c.name)}</div><div class="ruler-small">${esc(c.regime)} · ${esc(c.capital)}</div><div class="ruler-small">${esc(c.short)} · ${esc(CONTINENTS[c.continent].name)}</div></div></div>${rowLine('Population',fmt(x.population))}${rowLine('Superficie',`${fmt(x.areaKm2)} km²`)}${rowLine('Trésorerie',money(c.treasury))}${rowLine('Forces armées',fmt(c.soldiers))}${rowLine('Stabilité',pc(c.stability))}${rowLine('Légitimité',pc(c.legitimacy))}${rowLine('Impôts',pc(c.taxRate))}${rowLine('Solde migratoire',`${(c.migrationNet||0)>=0?'+':''}${fmt(c.migrationNet||0)}`)}<div style="margin-top:14px" class="btnrow">${c.id===10?btn('Donner un ordre','orders','primary'):btn('Relations diplomatiques','open-diplomacy','ghost')}</div></div>`;}
function provinceDetail(p){const c=country(p.countryId);return `<div class="ruler"><div class="ruler-badge"><div class="ruler-icon">⌖</div><div><div class="ruler-name">${esc(p.name)}</div><div class="ruler-small">${esc(c.short)} · ${esc(p.terrain)}</div></div></div>${rowLine('Habitants',fmt(p.population))}${rowLine('Superficie',`${fmt(p.areaKm2)} km²`)}${rowLine('Fertilité',pc(p.fertility))}${rowLine('Routes',pc(p.roads))}${rowLine('Santé',pc(p.health))}${rowLine('Scolarisation',pc(p.education))}${rowLine('Mécontentement',pc(p.unrest))}${rowLine('Bâtiments achevés',fmt(p.buildings.length))}${p.countryId===10?btn('Aménager cette province','orders','primary wide'):btn('Consulter le pays','view-country','ghost wide')}</div>`;}
function logs(max=7,types=[]){const array=s.events.filter(e=>!types.length||types.includes(e.kind)).slice(-max).reverse();return `<div class="chronicle">${array.length?array.map(e=>`<div class="logrow"><time>J${e.day} · ${esc(e.date)} · ${esc(e.kind)}</time><p>${esc(e.text)}</p></div>`).join(''):'<p class="empty">Aucun événement enregistré.</p>'}</div>`;}
function overview(){const c=player(),x=nationalStats(c),dom=resourceDominance(s);return `<div class="content-stack"><div class="intro-row"><div><div class="eyebrow">Tableau de bord souverain</div><h2>${esc(c.name)}</h2><p>11 nations · 3 continents · année ${1800+Math.floor(s.day/365)} · univers fictif</p></div><span class="tag"><i class="dot ${runSpeed?'':'off'}"></i> ${runSpeed?'Simulation active':'Simulation en pause'}</span></div><div class="stats-grid">${economyKPIs(c)}</div><div class="mid-layout"><div class="panel"><div class="panel-head"><div><h3>Carte géopolitique</h3><div class="panel-sub">44 provinces initiales · frontières modifiables par les guerres</div></div>${btn('Carte complète','world','small')}</div>${mapMarkup()}</div><div class="region-right">${panel('L’État et ses institutions',selectedProvince&&prov(selectedProvince)?provinceDetail(prov(selectedProvince)):profile(country(selectedNation)))}${panel('Le rapport stratégique',`<div class="section-pad"><div class="callout">Astérie possède les ${RESOURCES.length} catégories de ressources stratégiques. À la fondation, chacune dispose d’au moins 100× la réserve du deuxième détenteur. Ce ratio n’est pas maintenu artificiellement après exploitation ou échanges.</div>${rowLine('Ressources dominantes',`${dom.filter(r=>r.second>0&&r.ratio>=100).length} / ${dom.length}`)}${rowLine('Pays pétroliers',fmt(dom.find(r=>r.id==='petrole').countriesWithDeposit))}${rowLine('Projets en cours',fmt(s.projects.filter(p=>p.status==='chantier'&&p.owner===10).length))}${rowLine('Propositions reçues',fmt(activeProposals().filter(p=>p.to===10).length))}</div>`)}</div></div><div class="content-grid">${panel('Chroniques récentes',logs(5),'Conséquences enregistrées dans le moteur',btn('Toutes les chroniques','chronicle','small'))}${panel('Classement économique',rankings(),'Tous les pays sont soumis aux mêmes calculs',btn('Comparer les États','nations','small'))}</div></div>`;}
function world(){return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Géographie</div><h2>Trois continents séparés</h2><p>Un seul monde · 11 souverainetés · 44 provinces au lancement</p></div></div><div class="mid-layout"><div class="panel"><div class="panel-head"><h3>Atlas politique</h3></div>${mapMarkup()}</div>${panel(selectedProvince?'Province sélectionnée':'État sélectionné',selectedProvince&&prov(selectedProvince)?provinceDetail(prov(selectedProvince)):profile(country(selectedNation)))}</div>${panel('Atlas des continents',`<div class="cards-grid section-pad">${CONTINENTS.map(x=>`<article class="mini-card"><h4>${esc(x.name)}</h4><p>${esc(x.subtitle)}</p><strong>${s.countries.filter(c=>c.continent===x.id).length} États</strong><p>${fmt(s.countries.filter(c=>c.continent===x.id).reduce((a,c)=>a+nationalStats(c).areaKm2,0))} km²</p><button class="btn small" data-continent="${x.id}" data-action="world">Explorer</button></article>`).join('')}</div>`)}</div>`;}
function nations(){const c=country(selectedNation),x=nationalStats(c);return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">États & politique</div><h2>Les onze souverainetés</h2><p>Pas de protection spéciale pour Astérie · seuls les 10 rivaux disposent de contrôleurs IA</p></div></div>${panel('Classement des pays',rankings())}<div class="content-grid">${panel(`Dossier national : ${esc(c.short)}`,`<div class="section-pad">${details([['Régime',c.regime],['Capitale',c.capital],['Population',fmt(x.population)],['Superficie',`${fmt(x.areaKm2)} km²`],['Alphabétisation',pc(c.literacy)],['Chômage',pc(c.unemployment)],['Légitimité',pc(c.legitimacy)],['Stabilité',pc(c.stability)],['Corruption',pc(c.corruption)],['Solde migratoire',`${(c.migrationNet||0)>=0?'+':''}${fmt(c.migrationNet||0)}`]])}<div class="separator"></div>${rowLine('Fiscalité',pc(c.taxRate))}${rowLine('Expression publique',esc(c.rights.press))}${rowLine('Droit de réunion',esc(c.rights.assembly))}${rowLine('Conscription',esc(c.rights.conscription))}${rowLine('Successions',esc(c.succession))}</div>`, 'Choisir une nation dans le classement')}${panel('Provinces contrôlées',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Province</th><th class="num">Habitants</th><th class="num">km²</th><th class="num">Santé</th></tr></thead><tbody>${c.provinces.map(p=>`<tr class="clickable" data-province="${attr(p.id)}"><td>${esc(p.name)}</td><td class="num">${fmt(p.population)}</td><td class="num">${fmt(p.areaKm2)}</td><td class="num">${pc(p.health)}</td></tr>`).join('')}</tbody></table></div>`)}</div></div>`;}
function resources(){const d=resourceDominance(s),c=country(selectedNation);return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Géologie et matières premières</div><h2>18 ressources stratégiques</h2><p>Réserves dans le sol distinctes des stocks disponibles et des capacités techniques</p></div></div>${panel('Réserves géologiques et domination initiale',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Ressource</th><th class="num">Astérie</th><th class="num">2e détenteur</th><th class="num">Rapport actuel</th><th class="num">Pays détenteurs</th></tr></thead><tbody>${d.map(r=>`<tr><td>${esc(r.name)} <span class="tiny muted">(${esc(r.unit)})</span></td><td class="num tint">${fmt(r.player,2)}</td><td class="num">${fmt(r.second,2)} ${r.secondCountry!==null?`<span class="muted tiny">${esc(name(r.secondCountry))}</span>`:''}</td><td class="num ${r.ratio>=100?'up':'warning'}">${r.ratio===null?'—':`${fmt(r.ratio,1)}×`}</td><td class="num">${r.countriesWithDeposit}/11</td></tr>`).join('')}</tbody></table></div>`, 'Ratio garanti au lancement, susceptible d’évoluer par extraction et conquête')}<div class="content-grid">${panel(`Inventaire : ${esc(c.short)}`,`<div class="table-wrap"><table class="data-table"><thead><tr><th>Ressource</th><th class="num">Réserve</th><th class="num">Stock extrait</th></tr></thead><tbody>${[...RESOURCES,...COMMON].map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${fmt(c.reserves[r.id]||0,2)}</td><td class="num">${fmt(c.stocks[r.id]||0,3)}</td></tr>`).join('')}</tbody></table></div>`)}${panel('Exploitation minière',`<div class="section-pad"><p class="doc-note">Posséder une ressource ne signifie pas savoir l’extraire, la raffiner ou la commercialiser. Les techniques, le financement et la capacité d’exploitation doivent être disponibles.</p><div class="callout">Exemple : seuls Astérie et Mazir détiennent des gisements de pétrole au départ. Les neuf autres pays n’en ont pas.</div><div style="margin-top:13px">${btn('Lancer une prospection','orders','primary wide')}</div></div>`)}</div></div>`;}
function economy(){const c=player(),x=nationalStats(c);return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Ministère des finances</div><h2>Comptes publics et économie</h2><p>Unité monétaire : millions de couronnes (M Cr) · ordres de grandeur fictifs</p></div></div><div class="stats-grid">${economyKPIs(c)}</div>${panel('Programmes nationaux',`<div class="section-pad">${(s.programs||[]).filter(pr=>pr.owner===c.id).slice(-8).reverse().map(pr=>`<div class="meta-line"><span>${esc(PROGRAM_SECTORS[pr.sector]?.label||pr.sector)} · ${esc(pr.status)} · J${pr.started}–J${pr.finish}</span><strong>${money(pr.spent)} / ${money(pr.budget)}</strong></div>`).join('')||'<p class="empty">Aucun programme adopté.</p>'}<div class="separator"></div>${btn('Lancer un programme national','orders','primary')}</div>`)}<div class="content-grid">${panel('Budget et recettes',`<div class="section-pad">${rowLine('Impôt national',pc(c.taxRate))}${rowLine('Recettes du dernier jour',money(c.cashFlow.tax))}${rowLine('Services publics',money(c.cashFlow.spending))}${rowLine('Dépenses militaires',money(c.cashFlow.army))}${rowLine('Intérêts payés',money(c.cashFlow.interest))}${rowLine('Commerce extérieur (solde)',money(c.tradeBalance))}${rowLine('Patrimoine privé estimé',money(c.privateWealth))}${rowLine('Immigration totale',fmt(c.immigrants||0))}${rowLine('Émigration totale',fmt(c.emigrants||0))}${rowLine('Cargaisons en route',fmt(s.shipments.filter(sh=>sh.status==='en transit'&&(sh.from===10||sh.to===10)).length))}<div class="separator"></div>${Object.entries(c.budget).map(([k,v])=>`<div class="meta-line"><span>${esc(k)}</span><strong>${pc(v)}</strong></div><div class="meter"><span style="width:${Math.round(v*100)}%"></span></div>`).join('')}</div>`, 'Les dépenses effectivement réalisées figurent dans le journal comptable')}${panel('Grand livre · mouvements récents',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Jour</th><th>Opération</th><th class="num">Montant</th></tr></thead><tbody>${s.ledger.filter(x=>x.from.startsWith('10:')||x.to.startsWith('10:')).slice(-28).reverse().map(x=>`<tr><td>J${x.day}</td><td>${esc(x.reason)}</td><td class="num">${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="3">Aucune opération enregistrée</td></tr>'}</tbody></table></div>`, 'Journal des transferts entre comptes')}
</div>${panel('Situation des investissements',`<div class="section-pad cards-grid">${s.projects.filter(p=>p.owner===10).slice(-10).reverse().map(p=>`<div class="mini-card"><h4>${esc(p.label)}</h4><p>${esc(prov(p.provinceId)?.name||'Province inconnue')}</p><strong>${esc(p.status)}</strong> <span class="muted tiny">· J${p.finish}</span><div class="meter"><span style="width:${Math.round(p.progress*100)}%"></span></div></div>`).join('')||'<div class="empty">Aucun chantier commencé. Vous pouvez en financer un dans le menu Ordres.</div>'}</div>`)}</div>`;}
function populationScreen(){

body></table></div>`)}</div>`;

function markets(){
 const m=s.market||makeMarket();
 const prices=[...RESOURCES,...COMMON].map(r=>({
   r,index:m.index[r.id]??100,stock:sum(s.countries,c=>c.stocks[r.id]||0),
   last:m.history.length>1?m.history[m.history.length-2].prices[r.id]??100:100,
   owners:s.countries.filter(c=>c.reserves[r.id]>0).length
 })).sort((a,b)=>b.index-a.index);
 const shortage=prices.filter(x=>x.index>120).length;
 return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Conjoncture mondiale</div><h2>Marchés des matières premières</h2><p>Indices simulés (base 100), calculés sur les stocks, les besoins et les conflits. Aucun prix extérieur réel.</p></div></div>
 <div class="stats-grid">${smStat('Marchandises suivies',fmt(prices.length))}${smStat('Indices élevés (>120)',fmt(shortage))}${smStat('Pop. mondiale',fmt(totalWorldPopulation(s)))}${smStat('Guerres actives',fmt(s.wars.filter(w=>w.status==='en cours').length))}</div>
 ${panel('Prix et disponibilités mondiales',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Matière première</th><th class="num">Indice</th><th class="num">Variation</th><th class="num">Stock mondial</th><th class="num">Pays producteurs</th></tr></thead><tbody>${prices.map(x=>`<tr><td>${esc(x.r.name)}</td><td class="num">${fmt(x.index,1)}</td><td class="num ${x.index>x.last?'down':'up'}">${x.index===x.last?'—':(x.index>x.last?'+':'')+fmt(x.index-x.last,1)}</td><td class="num">${fmt(x.stock,2)} <small>${esc(x.r.unit)}</small></td><td class="num">${fmt(x.owners)}</td></tr>`).join('')}</tbody></table></div>`)}
 ${panel('Historique de la conjoncture',`<div class="section-pad">${(m.history||[]).slice(-12).reverse().map(x=>`<div class="meta-line"><span>J${x.day} · ${x.year}</span><strong>PIB mondial ${fmt(x.worldGDP,1)} M Cr · ${x.activeWars} guerre(s)</strong></div>`).join('')||'<p class="empty">Aucune observation.</p>'}<p class="doc-note">Indice 100 = point de départ de la simulation. Il n'est pas une cotation monétaire et n'effectue aucun transfert d'argent.</p></div>`)}
 </div>`;
}

function commerce(){
 const trades=s.shipments.slice(-80).reverse(),c=player(),ours=trades.filter(sh=>sh.from===10||sh.to===10),pending=trades.filter(sh=>sh.status==='en transit');
 return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Transport et marché extérieur</div><h2>Commerce et cargaisons</h2><p>Les marchandises ne se téléportent plus : départ, transport, pertes et réception</p></div>${btn('Proposer une vente','orders','primary')}</div><div class="stats-grid">${smStat('Cargaisons en transit',fmt(pending.length))}${smStat('Expéditions conclues',fmt(trades.length))}${smStat('Balance commerciale',money(c.tradeBalance))}${smStat('Droits de douane',`${fmt(c.tariff,1)} %`)}${smStat('Embargos déclarés',fmt(c.embargoes?.length||0))}</div>${panel('Expéditions mondiales',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Route</th><th>Ressource</th><th class="num">Quantité</th><th>Dates</th><th>État</th></tr></thead><tbody>${trades.map(sh=>`<tr><td>${esc(name(sh.from))} → ${esc(name(sh.to))}</td><td>${esc(sh.resource)}</td><td class="num">${fmt(sh.quantity,3)}</td><td>J${sh.depart} → J${sh.arrive}</td><td>${esc(sh.status)}${sh.status==='livrée'?` · pertes ${fmt(sh.loss,3)}`:''}</td></tr>`).join('')||'<tr><td colspan="5">Aucune expédition créée.</td></tr>'}</tbody></table></div>`)}${panel('Expéditions concernant Astérie',`<div class="section-pad">${ours.map(sh=>`<div class="meta-line"><span>${esc(sh.resource)} · ${esc(name(sh.from))} → ${esc(name(sh.to))}</span><strong>${esc(sh.status)}</strong></div>`).join('')||'<p class="empty">Aucun contrat commercial conclu pour Astérie.</p>'}<p class="doc-note">Le vendeur remet son stock au transporteur lorsque le contrat est accepté. Le pays acheteur le reçoit seulement à l’arrivée. Les pertes de transport sont tracées.</p></div>`)}</div>`;
}
function menu(){return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Navigation</div><h2>Explorer WORLD DYNASTY</h2><p>Tous les tableaux, y compris sur iPhone.</p></div></div><div class="cards-grid">${views.filter(v=>v[0]!=='menu').map(([id,ic,label])=>`<button class="mini-card nav-card" data-view="${id}"><span class="nav-icon">${ic}</span><h4>${esc(label)}</h4><p>Ouvrir cet écran</p></button>`).join('')}</div></div>`;}
function diplomacy(){const c=player(),received=activeProposals().filter(p=>p.to===10),out=activeProposals().filter(p=>p.from===10);return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Chancellerie</div><h2>Relations et traités</h2><p>Les États étrangers peuvent négocier entre eux, indépendamment de votre nation</p></div>${btn('Envoyer un ordre diplomatique','orders','primary')}</div>${panel('Relations bilatérales',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Partenaire</th><th>Régime</th><th class="num">Relation</th><th>Continent</th></tr></thead><tbody>${s.countries.filter(z=>z.id!==10).sort((a,b)=>c.relations[b.id]-c.relations[a.id]).map(x=>`<tr class="clickable" data-country="${x.id}"><td>${flag(x)} ${esc(x.short)}</td><td>${esc(x.regime)}</td><td class="num ${c.relations[x.id]>=0?'up':'down'}">${fmt(c.relations[x.id],2)}</td><td>${esc(CONTINENTS[x.continent].name)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="content-grid">${panel('Propositions reçues',`<div class="section-pad">${received.length?received.map(p=>`<div class="mini-card"><h4>${esc(name(p.from))} · ${esc(p.kind)}</h4><p>Proposition n°${p.id} · reçue J${p.day} · expiration J${p.expires}</p><div class="btnrow"><button class="btn small primary" data-respond="${p.id}" data-accept="true">Accepter</button><button class="btn small danger" data-respond="${p.id}" data-accept="false">Refuser</button></div></div>`).join(''):'<p class="empty">Aucune proposition en attente.</p>'}</div>`)}${panel('Traités et correspondances',`<div class="section-pad">${s.treaties.filter(t=>t.members.includes(10)).slice(-15).map(t=>`<div class="meta-line"><span>${esc(t.kind)} avec ${esc(name(t.members.find(id=>id!==10)))}</span><strong>Depuis J${t.signed}</strong></div>`).join('')||'<p class="empty">Aucun traité conclu.</p>'}${out.map(p=>`<div class="meta-line"><span>Proposition ${esc(p.kind)} à ${esc(name(p.to))}</span><strong>En attente</strong></div>`).join('')}</div>`)}</div></div>`;}
function military(){const c=player();return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Commandement général</div><h2>Forces et conflits</h2><p>Batailles calculées, pertes humaines, épuisement et changements territoriaux enregistrés</p></div>${btn('Ordre militaire','orders','primary')}</div><div class="stats-grid">${smStat('Soldats mobilisés',fmt(c.soldiers))}${smStat('Préparation',pc(c.militaryReadiness))}${smStat('Équipement',pc(c.militaryEquipment))}${smStat('Fatigue de guerre',pc(c.warExhaustion))}</div>${panel('Rapport des armées',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Pays</th><th class="num">Effectifs</th><th class="num">Préparation</th><th class="num">Flotte</th><th class="num">Guerre</th></tr></thead><tbody>${[...s.countries].sort((a,b)=>b.soldiers-a.soldiers).map(x=>`<tr data-country="${x.id}" class="clickable"><td>${flag(x)} ${esc(x.short)}</td><td class="num">${fmt(x.soldiers)}</td><td class="num">${pc(x.militaryReadiness)}</td><td class="num">${pc(x.navy)}</td><td class="num">${s.wars.filter(w=>w.status==='en cours'&&w.participants.includes(x.id)).length}</td></tr>`).join('')}</tbody></table></div>`)}${panel('Conflits recensés',`<div class="section-pad">${s.wars.length?s.wars.slice().reverse().map(w=>`<div class="mini-card"><h4>${esc(name(w.attacker))} contre ${esc(name(w.defender))}</h4><p>Début J${w.started} · ${esc(w.status)} · ${w.battles.length} batailles</p><strong>Score : ${fmt(w.score)}</strong><p>Pertes : ${fmt(Object.values(w.casualties).reduce((a,b)=>a+b,0))} soldats</p></div>`).join(''):'<p class="empty">Aucune guerre déclarée.</p>'}</div>`, 'La carte change effectivement lors d’une annexion')}
</div>`;}
function science(){const c=player();return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Académie des sciences</div><h2>Progrès et innovations</h2><p>La connaissance scientifique est distincte de la possession de matières premières</p></div>${btn('Financer la recherche','orders','primary')}</div>${panel('Technologies',`<div class="cards-grid section-pad">${Object.entries(TECHNOLOGIES).map(([id,t])=>{const status=c.tech.known.includes(id)?'Maîtrisée':c.tech.progress.find(x=>x.technology===id)?'En recherche':`Disponible à partir de ${t.unlock}`;return `<div class="mini-card"><h4>${esc(t.label)}</h4><p>${esc(status)}</p><strong>${money(t.cost)}</strong><p>${t.duration} jours de recherche</p><button class="btn small" data-research="${id}" ${c.tech.known.includes(id)||c.tech.progress.some(x=>x.technology===id)?'disabled':''}>Financer</button></div>`;}).join('')}</div>`)}${panel('Compétences préindustrielles',`<div class="section-pad">${Object.entries(c.tech.levels).map(([k,v])=>rowLine(esc(k),`Niveau ${fmt(v)}`)).join('')}</div>`)}</div>`;}
function agents(){return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Conseil des nations</div><h2>Dix gouvernements autonomes</h2><p>10 politiques nationales indépendantes · une nation humaine · aucune préférence codée pour le joueur</p></div></div>${panel('Type de contrôleur',`<div class="section-pad"><div class="callout"><strong>${s.mode==='gemini'?'Mode Gemini':'Mode de démonstration locale'}</strong><p>Chaque pays applique des politiques nationales régulières. En mode Gemini, les dix IA ajoutent des programmes stratégiques de plusieurs actions, selon les quotas disponibles. Aucun personnage individuel n'est simulé.</p></div><div class="btnrow" style="margin-top:12px">${btn('Utiliser les règles locales','set-local',s.mode==='local'?'primary':'ghost')}${btn('Activer Gemini','set-gemini',s.mode==='gemini'?'primary':'ghost',!server.geminiConfigured?'disabled title="Configurer GEMINI_API_KEY sur le serveur"':'')}</div>${server.geminiConfigured?`<p class="doc-note">Serveur connecté au modèle ${esc(server.model)}. Les requêtes peuvent être limitées ou facturées selon votre compte Google.</p>`:server.geminiAvailable?`<p class="doc-note">Gemini est configuré sur le serveur, mais protégé par un code. ${btn('Déverrouiller les agents','unlock-gemini','primary')}</p>`:'<p class="doc-note">Gemini n’est pas configuré. Les dirigeants utilisent temporairement les règles locales.</p>'}${agentError?`<p class="warning">Dernier problème : ${esc(agentError)}</p>`:''}</div>`)}${panel('Profils autonomes',`<div class="section-pad">${s.agents.map(a=>{const c=country(a.countryId);return `<div class="sim-agent"><div>${flag(c)} <strong>Gouvernement de ${esc(c.short)}</strong><small>${esc(a.persona)} · ${esc(a.objective)} · Stratégie : ${esc(a.strategy||'Développement national')}</small><small>Dernière décision : J${a.lastDecisionDay} · ${esc(a.lastSource)}</small></div><span class="chip">${a.privateMemory.length} souvenirs</span></div>`;}).join('')}</div>`)}${panel('Règles de leur autonomie',`<div class="section-pad doc-note">Chaque agent ne reçoit que les informations publiques connues, ses propres données, ses courriers et sa mémoire. Ses décisions sont proposées sous forme d’ordres et contrôlées par le même moteur que vos commandes. Aucun agent ne tourne lorsque l’onglet est fermé sans serveur de simulation permanent.</div>`)}</div>`;}
function chronicle(){return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Archives du monde</div><h2>Chroniques et décisions</h2><p>Événements datés · aucun événement canonique sans exécution par le moteur</p></div></div>${panel('Journal mondial',logs(150))}${panel('Derniers ordres contrôlés',`<div class="section-pad">${s.notes.slice(-35).reverse().map(n=>`<div class="meta-line"><span>J${n.day} · ${esc(name(s.orders.find(o=>o.id===n.id)?.actor||10))} · ${esc(n.kind)}</span><strong class="${n.status==='refusé'?'down':'up'}">${esc(n.status)}</strong></div>${n.reason?`<p class="tiny warning">${esc(n.reason)}</p>`:''}`).join('')||'<p class="empty">Aucun ordre encore traité.</p>'}</div>`)}</div>`;}
function settings(){const bytes=new Blob([JSON.stringify(s)]).size;return `<div class="content-stack"><div class="view-title"><div><div class="eyebrow">Administration du monde</div><h2>Sauvegardes et paramètres</h2><p>Graine initiale ${s.initialSeed} · Version ${esc(s.version)} · jour ${s.day}</p></div></div>${panel('Partie locale',`<div class="section-pad">${details([['Pays',`${s.countries.length}`],['Provinces',fmt(s.countries.reduce((n,c)=>n+c.provinces.length,0))],['Événements',fmt(s.events.length)],['Mouvements comptables',fmt(s.ledger.length)],['Taille de la sauvegarde',`${fmt(bytes/1024,1)} Ko`],['Mode IA',s.mode==='local'?'Règles':'Gemini']])}<div class="separator"></div><div class="btnrow">${btn('Enregistrer','save','primary')}${btn('Exporter la partie (.json)','export')}${btn('Importer une sauvegarde','import')}${btn('Nouvelle partie','reset','danger')}</div><input id="import-save" type="file" accept=".json,application/json" class="hidden"/></div>`)}${panel('Ce qui est calculé, ce qui reste à créer',`<div class="section-pad doc-note"><p><strong>Actif :</strong> 11 pays, 3 continents, 44 provinces initiales, naissances, mortalité et migrations internationales simplifiées, agriculture, trésoreries, recettes et dépenses, recherches, chantiers, cargaisons avec délais, prêts, traités, lois et effets sociaux, guerres, modifications de frontières, agents locaux, journaux et sauvegardes.</p><p><strong>À approfondir :</strong> marchés multi-marchandises, transport réel, classes sociales, cartographie géologique détaillée, armées en déplacement sur une grille, institutions internes, agents Gemini branchés et testés.</p><p><strong>Limites :</strong> carte géographique fictive schématique; jours en temps accéléré et non calcul continu physique; les données sont inventées au départ et ne représentent aucune économie historique réelle. La règle 100× concerne le lancement et non un bonus renouvelable.</p></div>`)}</div>`;}
function topbar(){const c=player();return `<header class="topbar"><div class="location"><div class="eyebrow">WORLD DYNASTY · MONDE CAUSAL</div><h1>${esc(c.short)} <span class="muted">/ ${esc(CONTINENTS[c.continent].name)}</span></h1></div><div class="time-controls"><div class="date-area"><strong>${esc(humanDate())}</strong><span>J${s.day} · ${s.mode==='gemini'?'Agents Gemini':'Contrôleurs locaux'}</span></div><button class="time-pill ${runSpeed===0?'selected':''}" data-speed="0" title="Mettre le monde en pause">Ⅱ</button><button class="time-pill ${runSpeed>0?'selected':''}" data-action="time-play" title="Démarrer / reprendre la simulation">▶</button><select id="sim-speed" class="sim-speed" aria-label="Vitesse : jours de jeu par seconde" title="Jours simulés par seconde">${TIME_SPEEDS.map(n=>`<option value="${n}" ${selectedSpeed===n?'selected':''}>×${n}</option>`).join('')}</select><select id="jump-sim" class="sim-speed jump-speed" aria-label="Sauter une période du jeu" title="Avancer dans le calendrier simulé"><option value="">⏩ Saut</option><option value="7">+ 7 jours</option><option value="30">+ 30 jours</option><option value="365">+ 1 an</option><option value="1825">+ 5 ans</option></select><button class="more-button" title="Ordres" data-action="orders">+</button></div></header>`;}
function shell(){const content=({overview,world,nations,resources,economy,population:populationScreen,commerce,markets,diplomacy,military,science,agents,chronicle,settings,menu})[currentView]();return `<div class="app-shell"><aside class="sidebar"><div class="brand-area"><div class="brand-title">WORLD <span class="tint">DYNASTY</span></div><div class="brand-sub">Le monde n'attend personne</div></div><nav><div class="nav-title">Le monde</div><div class="nav-list">${views.map(([id,ic,label])=>`<button class="nav-item ${currentView===id?'active':''}" data-view="${id}"><span class="nav-icon">${ic}</span> ${label}</button>`).join('')}</div></nav><div class="sidebar-footer"><div class="eyebrow">Règle fondatrice</div><p class="tiny">Aucun pays n'est protégé. Les ressources ont des quantités, les décisions des coûts et les actions des conséquences.</p><div class="tag"><i class="dot ${server.geminiConfigured?'':'off'}"></i> ${server.geminiConfigured?'Gemini disponible':'IA locale simulée'}</div></div></aside><main class="main">${topbar()}${content}</main><nav class="mobile-nav">${[['overview','◈','Accueil'],['world','◉','Carte'],['resources','◆','Ressources'],['diplomacy','✉','Diplomatie'],['nations','♜','Pays'],['menu','☷','Plus']].map(([id,ic,label])=>`<button data-view="${id}" class="${currentView===id?'active':''}"><span class="mobile-ic">${ic}</span>${label}</button>`).join('')}</nav></div>${modal?modalHtml():''}${notice?`<div class="toast">${esc(notice)}</div>`:''}`;}
function render(){renderCount++;app.innerHTML=shell();}
function field(label,name,control){return `<div class="field"><label for="f-${name}">${label}</label>${control}</div>`;}
function select(name,options){return `<select class="select" name="${name}" id="f-${name}">${options.map(([v,t])=>`<option value="${attr(v)}">${esc(t)}</option>`).join('')}</select>`;}
function inp(name,type='number',val='',extra=''){return `<input class="input" type="${type}" name="${name}" id="f-${name}" value="${attr(val)}" ${extra} required/>`;}
function ordersForm(){const targets=s.countries.filter(c=>c.id!==10).map(c=>[c.id,c.name]);const provinces=player().provinces.map(p=>[p.id,p.name]);const list=[['law','Adopter une loi'],['budget','Répartir le budget'],['project','Construire un bâtiment'],['program','Programme national'],['embargo','Décréter un embargo'],['lift_embargo','Lever un embargo'],['policy','Changer la fiscalité'],['research','Financer la recherche'],['recruit','Recruter des soldats'],['demobilize','Démobiliser'],['relief','Aide à la population'],['explore','Prospection'],['extract','Extraction'],['propose','Proposer un traité'],['message','Message diplomatique'],['gift','Don diplomatique'],['trade','Vendre des ressources'],['request_trade','Demander un achat international'],['loan','Proposer un prêt'],['declare_war','Déclarer une guerre'],['peace','Demander la paix'],['spy','Mission de renseignement']];
const kind=modal.kind||'project';
const other=field('Pays concerné','target',select('target',targets));
let html='';
switch(kind){
 case 'law':html=field('Disposition législative','lawRule',select('lawRule',[['press=libre','Presse libre'],['press=censurée','Presse censurée'],['assembly=autorisé','Droit de réunion autorisé'],['assembly=restreint','Droit de réunion restreint'],['conscription=volontaire','Service militaire volontaire'],['conscription=obligatoire','Conscription obligatoire'],['judicial=civil','Justice civile'],['judicial=militaire','Justice militaire']]));break;
 case 'budget':html=field('Part services sociaux','services',inp('services','number',player().budget.services,'min="0" max="1" step="0.01"'))+field('Part administration','administration',inp('administration','number',player().budget.administration,'min="0" max="1" step="0.01"'))+field('Part défense','defense',inp('defense','number',player().budget.defense,'min="0" max="1" step="0.01"'))+field('Part infrastructures','infrastructure',inp('infrastructure','number',player().budget.infrastructure,'min="0" max="1" step="0.01"'))+field('Part recherche','research',inp('research','number',player().budget.research,'min="0" max="1" step="0.01"'))+'<p class="doc-note">Les cinq parts doivent totaliser 1,00 (100 %).</p>';break;
 case 'project':html=field('Projet','project',select('project',Object.entries(PROJECTS).map(([id,p])=>[id,`${p.label} — ${p.cost} M Cr`])))+field('Province','provinceId',select('provinceId',provinces));break;
 case 'program':html=field('Programme','sector',select('sector',Object.entries(PROGRAM_SECTORS).map(([id,v])=>[id,v.label])))+field('Province','provinceId',select('provinceId',provinces))+field('Budget total (M Cr)','budget',inp('budget','number',300,'min="30" max="2500"'))+field('Durée du programme (jours)','duration',inp('duration','number',365,'min="90" max="1825"'));break;
 case 'embargo':case 'lift_embargo':html=other;break;
 case 'policy':html=field('Politique à modifier','policyField',select('policyField',[['taxRate','Fiscalité (de 0,02 à 0,48)'],['tariff','Droits de douane (0 à 40 %)'],['openBorders','Ouverture des frontières (0 à 1)'],['welfare','Aides sociales (0 à 1)'],['antiCorruption','Lutte anticorruption (0 à 1)'],['educationPriority','Priorité éducative (0 à 1)']]))+field('Nouvelle valeur','value',inp('value','number',player().taxRate,'step="0.01" min="0" max="40"'))+'<p class="doc-note">Une valeur de 0 ferme les frontières; 1 correspond à une ouverture maximale. Les effets se propagent progressivement.</p>';break;
 case 'research':html=field('Technologie','technology',select('technology',Object.entries(TECHNOLOGIES).map(([id,t])=>[id,`${t.label} — ${t.cost} M Cr`])));break;
 case 'recruit':case 'demobilize':html=field('Nombre de soldats','count',inp('count','number',kind==='recruit'?1000:500,'min="1" step="1"'));break;
 case 'relief':html=field('Aide en millions de couronnes','amount',inp('amount','number',50,'min="10" max="2000"'));break;
 case 'explore':html=field('Ressource à prospecter','resource',select('resource',RESOURCES.map(r=>[r.id,r.name])));break;
 case 'extract':html=field('Ressource à extraire','resource',select('resource',RESOURCES.map(r=>[r.id,r.name])))+field('Quantité dans son unité','quantity',inp('quantity','number',1,'step="0.01" min="0.01"'));break;
 case 'propose':html=other+field('Nature de l’accord','proposalKind',select('proposalKind',[['commerce','Commerce'],['alliance','Alliance'],['non_agression','Non-agression'],['paix','Paix']]));break;
 case 'message':html=other+field('Message','text','<textarea name="text" id="f-text" class="textarea" minlength="2" maxlength="600" required>Nous souhaitons développer des relations diplomatiques.</textarea>');break;
 case 'gift':html=other+field('Montant (M Cr)','amount',inp('amount','number',30,'step="1" min="1"'));break;
 case 'request_trade':case 'trade':html=other+field('Ressource','resource',select('resource',[...RESOURCES,...COMMON].map(r=>[r.id,r.name])))+field('Quantité','quantity',inp('quantity','number',1,'step="0.01" min="0.001"'))+field('Prix total (M Cr)','price',inp('price','number',10,'step="0.01" min="0.01"'));break;
 case 'loan':html=other+field('Somme prêtée (M Cr)','amount',inp('amount','number',100,'min="10"'))+field('Intérêts annuels (décimal)','rate',inp('rate','number',.05,'min="0" max="0.30" step="0.01"'))+field('Échéance en jours','duration',inp('duration','number',365,'min="30" max="3650"'));break;
 default:html=other;
 }
 return `<div class="form-info">Vous dirigez Astérie. Vos ordres sont mis en file et appliqués lors du prochain jour de simulation. Un ordre impossible sera refusé, sans créer d’argent ni de ressources.</div><form id="orders-form" class="fieldset"><div class="field">${field('Nature de l’ordre','kind',select('kind',list.map(([id,label])=>[id,label]).sort((a,b)=>a[0]===kind?-1:b[0]===kind?1:0)))}</div>${html}<button class="btn primary wide" type="submit">Transmettre l’ordre</button></form>`;
}
function modalHtml(){return `<div class="modal-wrap" data-action="close" id="modal-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-label="Ordres du souverain"><div class="dialog-top"><h3>Ordres du souverain</h3><button class="dialog-close" data-action="close" aria-label="Fermer">×</button></div><div class="dialog-body">${ordersForm()}</div></div></div>`;}
function setView(id){if(!views.some(v=>v[0]===id))return;currentView=id;window.scrollTo({top:0,behavior:'instant'});render();}
function submitOrder(form){const d=Object.fromEntries(new FormData(form)),kind=d.kind;delete d.kind;let payload={};
 for(const [k,v] of Object.entries(d))payload[k]=v;
 if(payload.target!==undefined)payload.target=Number(payload.target);
 for(const key of ['count','quantity','price','amount','rate','duration','value'])if(payload[key]!==undefined)payload[key]=Number(payload[key]);
 if(kind==='law'){const rule=payload.lawRule.split('=');payload={field:rule[0],value:rule[1]};}
 if(kind==='budget'){payload={budget:{services:Number(payload.services),administration:Number(payload.administration),defense:Number(payload.defense),infrastructure:Number(payload.infrastructure),research:Number(payload.research)}};}
 if(kind==='policy')payload={field:payload.policyField,value:payload.value};
 if(kind==='propose'){payload.kind=payload.proposalKind;delete payload.proposalKind;}
 try{const o=command(s,10,kind,payload);modal=null;save();message(`Ordre n°${o.id} transmis. Il sera examiné au prochain jour.`);}catch(e){message(e.message||'Commande refusée.');}
}
function resetWorld(){if(!confirm('Créer un nouveau monde ? La sauvegarde locale actuelle sera remplacée. Exportez-la d’abord si nécessaire.'))return;runSpeed=0;s=createWorld();selectedNation=10;selectedProvince=null;continentFilter='all';currentView='overview';save();message('Nouveau monde créé, au 1er janvier 1800.');}
function exportWorld(){const file=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=`WORLD_DYNASTY_J${s.day}_${s.initialSeed}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importWorld(file){try{if(file.size>15_000_000)throw Error('Sauvegarde trop lourde');const value=restoreWorld(await file.text());runSpeed=0;s=value;selectedNation=10;selectedProvince=null;save();message('Sauvegarde importée. Simulation en pause.');}catch(e){message(`Importation refusée : ${e.message}`);}}
async function unlockGemini(){const accessCode=prompt('Code d’accès privé WORLD DYNASTY (pas la clé Gemini) :');if(!accessCode)return;try{const r=await fetch('/api/session',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({accessCode})});const d=await r.json();if(!r.ok)throw Error(d.error||'Accès refusé');server=await (await fetch('/api/status',{credentials:'same-origin'})).json();message('Gemini déverrouillé. Tu peux activer les dix agents.');}catch(e){message(e.message);}}
function changeMode(id){if(id==='gemini'&&!server.geminiConfigured){message('Configure d’abord GEMINI_API_KEY sur le serveur.');return;}if(id==='gemini'&&!confirm('Activer Gemini ? Les requêtes utilisent les quotas et les conditions tarifaires de votre projet Google.'))return;s.mode=id;save();message(id==='gemini'?'Mode Gemini activé. Les 10 agents réfléchiront à tour de rôle pendant la simulation.':'Contrôleurs locaux activés.');}
function step(days){try{tick(s,days);save();render();}catch(e){runSpeed=0;message(e.message);}}
let lastAuto=performance.now(), accumulatedGameDays=0, lastVisual=0, lastStored=0, jumpInProgress=false;
function resetClock(){lastAuto=performance.now();accumulatedGameDays=0;}
// Vitesse = jours SIMULÉS par seconde, sans dépendre de la date du téléphone.
// Le traitement est réparti en petits lots, afin de conserver une interface utilisable sur iPhone.
setInterval(()=>{
 const now=performance.now();const elapsed=Math.min(.25,Math.max(0,(now-lastAuto)/1000));lastAuto=now;
 if(!runSpeed||jumpInProgress||document.hidden){accumulatedGameDays=0;return;}
 accumulatedGameDays+=elapsed*runSpeed;
 const days=Math.min(30,Math.floor(accumulatedGameDays));if(days<1)return;
 try{tick(s,days);accumulatedGameDays-=days;
   if(now-lastVisual>200){lastVisual=now;render();}
   if(now-lastStored>1100){lastStored=now;save();}
 }catch(e){runSpeed=0;accumulatedGameDays=0;message(e.message);}
},50);
document.addEventListener('visibilitychange',()=>{resetClock();if(document.hidden)save();});
async function jumpSimDays(total){
 if(jumpInProgress||!Number.isInteger(total)||total<1||total>1825)return;
 if(s.mode==='gemini'&&!confirm('Ce saut rapide fait avancer le calendrier sans attendre les décisions des 10 agents Gemini. Les agents ne pourront pas réagir à chaque événement traversé. Continuer ?'))return;
 jumpInProgress=true;runSpeed=0;resetClock();render();
 try{let left=total;while(left>0){const d=Math.min(60,left);tick(s,d);left-=d;if(left>0)await new Promise(resolve=>setTimeout(resolve,0));}
  save();message(`${total} jour(s) simulé(s) écoulé(s). Monde en pause.`);
 }catch(e){save();message('Simulation arrêtée : '+e.message);}
 finally{jumpInProgress=false;resetClock();render();}
}


async function maybeGemini(){if(s.mode!=='gemini'||!runSpeed||!server.geminiConfigured||activeAgent)return;const now=Date.now();if(now-lastAgentCall<7000||now<geminiBackoffUntil)return;const agent=s.agents.filter(a=>(a.nextGeminiDay??0)<=s.day).sort((a,b)=>(a.nextGeminiDay??0)-(b.nextGeminiDay??0))[0];if(!agent)return;
 activeAgent=true;lastAgentCall=now;
 try{const view=agentView(s,agent.countryId);const r=await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(view)});const data=await r.json();if(!r.ok)throw Error(data.error||`Erreur ${r.status}`);
 if(s.mode!=='gemini')return;applyAgentDecision(s,agent.countryId,data.decision);agentError='';save();render();}
 catch(e){agentError=e.message||'Erreur de connexion';geminiBackoffUntil=Date.now()+90000;agent.nextGeminiDay=Math.max(s.day+40,agent.nextGeminiDay||0);save();message('Gemini momentanément indisponible : les politiques nationales automatiques continuent, sans inventer de décision Gemini.');}
 finally{activeAgent=false;}
}
setInterval(maybeGemini,2000);
app.addEventListener('change',async e=>{if(e.target.id==='sim-speed'){const next=Number(e.target.value);if(TIME_SPEEDS.includes(next)){selectedSpeed=next;runSpeed=next;resetClock();render();}return;}if(e.target.id==='jump-sim'){const days=Number(e.target.value);e.target.value='';if(days)await jumpSimDays(days);return;}if(e.target.id==='import-save'&&e.target.files?.[0])await importWorld(e.target.files[0]);if(e.target.name==='kind'&&modal){modal.kind=e.target.value;render();}if(e.target.name==='policyField'){const node=document.querySelector('#f-value');if(node){const k=e.target.value;node.value=k==='taxRate'?player().taxRate:k==='tariff'?player().tariff:player().policy[k];}}});
app.addEventListener('submit',e=>{if(e.target.id==='orders-form'){e.preventDefault();submitOrder(e.target);}});
app.addEventListener('click',e=>{
 const kind=e.target.closest('[data-view]');if(kind){setView(kind.dataset.view);return;}
 const clickCont=e.target.closest('[data-continent]');if(clickCont){continentFilter=clickCont.dataset.continent;currentView=currentView==='overview'?'world':currentView;render();return;}
 const layer=e.target.closest('[data-layer]');if(layer){mapLayer=layer.dataset.layer;render();return;}
 const selectProvince=e.target.closest('[data-province]');if(selectProvince){const p=prov(selectProvince.dataset.province);if(p){selectedProvince=p.id;selectedNation=p.countryId;render();}return;}
 const selectCountry=e.target.closest('[data-country]');if(selectCountry){selectedNation=Number(selectCountry.dataset.country);selectedProvince=null;currentView='nations';render();return;}
 const speed=e.target.closest('[data-speed]');if(speed){runSpeed=0;resetClock();render();return;}
 const response=e.target.closest('[data-respond]');if(response){const id=Number(response.dataset.respond),accept=response.dataset.accept==='true';try{command(s,10,'respond',{proposalId:id,accept});save();message('Réponse enregistrée pour le prochain jour.');}catch(ex){message(ex.message);}return;}
 const research=e.target.closest('[data-research]');if(research){try{command(s,10,'research',{technology:research.dataset.research});save();message('Recherche inscrite dans les ordres.');}catch(ex){message(ex.message);}return;}
 const actionEl=e.target.closest('[data-action]');if(!actionEl)return;
 const action=actionEl.dataset.action;
 if(action==='close'){if(e.target.id==='modal-backdrop'||actionEl.classList.contains('dialog-close')){modal=null;render();}return;}
 if(action==='orders'){modal={kind:'project'};render();return;}
 if(action==='world'||action==='nations'||action==='chronicle'||action==='resources'){setView(action);return;}
 if(action==='open-diplomacy'){setView('diplomacy');return;}
 if(action==='view-country'){setView('nations');return;}
 if(action==='save'){save();message('Partie enregistrée sur cet appareil.');return;}
 if(action==='export'){exportWorld();return;}
 if(action==='import'){document.querySelector('#import-save')?.click();return;}
 if(action==='reset'){resetWorld();return;}
 if(action==='time-play'){runSpeed=selectedSpeed;resetClock();render();return;}
 if(action==='set-local'){changeMode('local');return;}
 if(action==='set-gemini'){changeMode('gemini');return;}
 if(action==='unlock-gemini'){unlockGemini();return;}
});
window.addEventListener('beforeunload',()=>save());
fetch('/api/status').then(r=>r.json()).then(x=>{server=x;render();}).catch(()=>{server={geminiConfigured:false};render();});
render();
</script></body></html>
